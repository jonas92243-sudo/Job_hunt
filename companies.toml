# Companies the scanner watches.
#
# To add one, the easiest way is:   python add_company.py "Company Name" <careers page link>
# To stop watching one, delete its block or put # in front of each of its lines.
#
# ats   = which job system the company uses
# board = the company's identifier inside that system
#         (for workday it is tenant/wdN/site, taken from the careers page address)

