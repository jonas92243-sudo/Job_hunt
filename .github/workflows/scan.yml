name: Scan job boards

# GitHub's own scheduler skipped most scheduled scans, so this workflow does not
# use it. One run scans every 30 minutes for about five hours, then starts the
# next run. "Keep scanner running" restarts the chain if it ever breaks.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Never run two scanners at once; a new run waits for the one in progress.
concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Scan every 30 minutes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/scan_loop.sh

      # GitHub switches off scheduled workflows in repositories with no activity
      # for 60 days, so make a small commit when the main branch has been quiet.
      - name: Keep the schedule active
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u +%F > .keepalive
            git config user.name "job-scanner"
            git config user.email "job-scanner@users.noreply.github.com"
            git add .keepalive
            git commit --quiet -m "Keep scheduled scans active"
            git push --quiet origin HEAD:main
          fi

      # Skipped when a step above failed or the run was cancelled, so a broken
      # scanner cannot restart itself in a tight loop.
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref main
